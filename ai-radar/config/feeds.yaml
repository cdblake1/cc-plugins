# AI Radar — curated default sources. Editable: add/remove freely.
# The RSS source validates each feed at runtime and skips any that are dead/unreachable,
# so a stale URL here never breaks a run. URLs reflect best-known public feeds as of 2026-05.

# arXiv categories searched by the `arxiv` source (combined with your --topic query).
arxiv_categories:
  - cs.AI   # Artificial Intelligence
  - cs.LG   # Machine Learning
  - cs.CL   # Computation and Language (NLP / LLMs)
  - cs.CV   # Computer Vision
  - cs.NE   # Neural and Evolutionary Computing
  - cs.MA   # Multi-Agent Systems
  - cs.SE   # Software Engineering
  - cs.IR   # Information Retrieval (RAG, search)
  - stat.ML # Statistics — Machine Learning

# RSS/Atom feeds for the `rss` source. Covers BOTH AI news AND key creator/lab blogs.
# Grouped only for readability; the source flattens these.
rss_feeds:
  labs_and_creators:
    - { name: "OpenAI", url: "https://openai.com/news/rss.xml" }
    - { name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml" }
