# YouTube channels for the `youtube` source (handles, IDs, or URLs). The source pulls each
# channel's recent videos AND does a topic search; channel videos are kept when the title
# matches the topic. Transcripts are used when available, else the title+description.
youtube_channels:
  - "@TwoMinutePapers"
  - "@YannicKilcher"
  - "@AICoffeeBreak"
  - "@machinelearningstreettalk"
  - "@sentdex"
  - "@AndrejKarpathy"

# Hacker News (Algolia Search API) defaults.
hackernews:
  tags: story
  points_min: 0
