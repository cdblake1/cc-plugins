# Fly.io config for the AI Radar runner.
# Launch from the ai-radar/ directory:
#   fly launch --no-deploy --copy-config        # creates the app (edit the name below first)
#   fly volumes create ai_radar_data --size 1   # 1 GB persistent volume for the SQLite store
#   fly ips allocate-v4                          # dedicated egress IP → reliable YouTube
#   fly secrets set GITHUB_TOKEN=ghp_... GIT_REPO_URL=github.com/cdblake1/cc-plugins.git \
#                   PULL_TOKEN=$(openssl rand -hex 16) \
#                   CLAUDE_CODE_OAUTH_TOKEN=...   # from `claude setup-token` (subscription summaries)
#                   YT_COOKIES="$(cat cookies.txt)"  # throwaway Google account cookies (optional)
#   fly deploy
#
# Default mode is "http": a scale-to-zero front door. The machine sleeps when idle and
# auto-starts on an inbound request; GET /pull (with PULL_TOKEN) runs one digest in the
# background, then it idles back to zero. Drive it weekly from a cron/GitHub Action, or hit
# it on demand:  curl -H "Authorization: Bearer $PULL_TOKEN" https://<app>.fly.dev/pull
#
# Alternatives: SCHEDULE_MODE=loop (always-on self-scheduling; set INTERVAL_SECONDS=604800
# for weekly) or SCHEDULE_MODE=once (one run then exit, for a Fly scheduled machine).

app = "ai-radar-CHANGEME"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[mounts]
  source = "ai_radar_data"
  destination = "/data"

[env]
  AI_RADAR_DB = "/data/store.db"
  SCHEDULE_MODE = "http"        # scale-to-zero serverless /pull (see [http_service])
  PORT = "8080"
  INTERVAL_SECONDS = "604800"   # only used in loop mode; weekly
  DIGEST_SUBDIR = "ai-radar/digests"
  # Summarize via the headless Claude CLI on your subscription ($0 API). Needs the
  # CLAUDE_CODE_OAUTH_TOKEN secret; falls back to free extractive if absent.
  SUMMARIZER = "claude_code"
  # Throttle YouTube so cookied traffic looks human (seconds between requests).
  YT_SLEEP_SECONDS = "2"
  # One-time historical backfill of all topics on first boot (marker kept on the volume).
  BACKFILL_MONTHS = "6"

# Scale-to-zero HTTP front door. An inbound request auto-starts a stopped machine; it
# auto-stops when idle, so a stopped machine costs only the volume.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
