# AI Radar: fetch real sources → digest + wiki + static site → GitHub Pages.
#
# MANUAL-ONLY. The scheduled pipeline now runs on Fly (see ai-radar-pull.yml + the Fly
# scale-to-zero runner), which has a dedicated IP so YouTube transcripts resolve. This
# workflow stays for two on-demand jobs you can't do from Fly: (a) one-off fetch/backfill
# runs on GitHub's open network, and (b) (re)deploying the site to GitHub Pages. Trigger it
# from the Actions tab → Run workflow. The daily cron was removed so it no longer races the
# weekly Fly pull (both commit digest/wiki back to this repo).
#
# To serve the site at https://<owner>.github.io/<repo>/:
#   Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional: add an ANTHROPIC_API_KEY repo secret to get Claude summaries (else free
# extractive summaries are used automatically).
#
# Even without Pages enabled, the built site is uploaded as a downloadable artifact,
# and the digest + wiki markdown are committed back to the repo.

name: AI Radar

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [digest, fetch, backfill]
        default: digest
      topic:
        description: "Topic (required for fetch; backfill/digest blank = all topics in topics.yaml)"
        required: false
        default: ""
      months:
        description: "backfill: how many months back"
        required: false
        default: "6"
      window:
        description: "backfill: window size"
        type: choice
        options: [weekly, monthly]
        default: weekly
      sources:
        description: "Sources: all or comma list (backfill works best with arxiv,hackernews)"
        required: false
        default: "all"
      channel:
        description: "backfill: YouTube channel (optional, e.g. @handle)"
        required: false
        default: ""
      since:
        description: "fetch: ISO date lower bound (optional)"
        required: false
        default: ""
      max:
        description: "Max results per source (per window for backfill)"
        required: false
        default: "8"
  # No schedule: the daily run now lives on Fly (ai-radar-pull.yml). This workflow is
  # manual-only so the two schedulers don't both commit to the repo. Run it on demand for
  # one-off fetch/backfill on GitHub's network or to (re)publish GitHub Pages.

permissions:
  contents: write   # commit digest/wiki back
  pages: write      # deploy Pages
  id-token: write   # Pages deploy auth

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-radar
    env:
      AI_RADAR_DB: ${{ github.workspace }}/.cache/ai-radar/store.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ai-radar
        run: pip install ".[llm]"

      # Persist the SQLite store across runs so history accumulates.
      - name: Restore store
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/ai-radar
          key: ai-radar-db-${{ github.run_id }}
          restore-keys: ai-radar-db-

      - name: Fetch / backfill
        env:
          TASK: ${{ github.event.inputs.task || 'digest' }}
          TOPIC: ${{ github.event.inputs.topic }}
          MONTHS: ${{ github.event.inputs.months || '6' }}
          WINDOW: ${{ github.event.inputs.window || 'weekly' }}
          SOURCES: ${{ github.event.inputs.sources || 'all' }}
          CHANNEL: ${{ github.event.inputs.channel }}
          SINCE: ${{ github.event.inputs.since }}
          MAXR: ${{ github.event.inputs.max || '8' }}
        run: |
          mkdir -p "$(dirname "$AI_RADAR_DB")"
          case "$TASK" in
            backfill)
              # Blank topic → backfill every topic in config/topics.yaml.
              flags=(--months "$MONTHS" --window "$WINDOW" --sources "$SOURCES" --max "$MAXR")
              [ -n "$CHANNEL" ] && flags+=(--channel "$CHANNEL")
              if [ -n "$TOPIC" ]; then
                ai-radar backfill "$TOPIC" "${flags[@]}"
              else
                ai-radar backfill "${flags[@]}"
              fi
              ;;
            fetch)
              if [ -z "$TOPIC" ]; then echo "::error::fetch requires a topic"; exit 1; fi
              args=(fetch "$TOPIC" --sources "$SOURCES" --max "$MAXR")
              [ -n "$SINCE" ] && args+=(--since "$SINCE")
              ai-radar "${args[@]}"
              ;;
          esac
          # Always (re)build the digest: produces the per-doc Sonnet summaries (budget-capped
          # and cached, so a big backfill's summaries catch up across runs) plus the curated
          # digest markdown. For the `digest` task this also does the fetch.
          ai-radar digest --out-dir digests

      - name: Build wiki + site
        run: |
          ai-radar wiki --out-dir wiki
          ai-radar site --out-dir "${{ github.workspace }}/_site" --title "AI Radar"

      - name: Save store
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}/.cache/ai-radar
          key: ai-radar-db-${{ github.run_id }}

      - name: Commit digest + wiki
        run: |
          git config user.name  "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add digests wiki || true
          if ! git diff --cached --quiet; then
            git commit -m "ai-radar: refresh digest + wiki [skip ci]"
            git push
          else
            echo "no changes to commit"
          fi

      # Auto-enable Pages (build_type: workflow) so the deploy step works without a
      # manual Settings → Pages toggle. Tolerant: if it can't enable, the run still
      # succeeds and the site is available as the artifact below.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Don't red-X the whole run if Pages isn't enabled yet — the fetch/wiki/site/commit
    # already succeeded and the site is downloadable as an artifact.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
