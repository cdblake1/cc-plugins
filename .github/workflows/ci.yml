name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Bundle in sync + guardrail tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-journal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build deps
        run: npm ci
      - name: Rebuild the MCP bundle
        run: npm run build
      - name: Bundle is in sync with source
        # Fails if mcp/server.bundle.mjs drifts from `npm run build` output.
        run: git diff --exit-code mcp/server.bundle.mjs
      - name: Guardrail unit tests
        run: npm test

  validate:
    name: Plugin validate (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        run: claude plugin validate ./session-journal --strict
